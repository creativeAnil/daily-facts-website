<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Download the Daily Facts Android app.">
  <link rel="icon" href="assets/logo.png">
  <title>Daily Facts</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page">

    <section class="hero">

      <div class="copy">

        <img
          class="logo"
          src="assets/logo.png"
          alt="Daily Facts logo"
        >

        <p class="kicker">ANDROID APP</p>

        <h1>Daily Facts</h1>

        <p class="tagline">हर दिन कुछ नया जानें</p>

        <p class="description">
          Interesting facts across science, history, nature, technology,
          human body, space and more.
        </p>

        <a
          id="downloadButton"
          class="download"
          href="#"
          target="_blank"
          rel="noopener"
        >
          Download APK
        </a>

        <p class="version">
          Latest version:
          <strong id="version">Loading...</strong>
          · Android
        </p>

        <a
          id="releaseLink"
          class="release"
          href="#"
          target="_blank"
          rel="noopener"
        >
          View official release
        </a>

      </div>

      <div class="preview">
        <img
          id="appScreenshot"
          src="assets/app-screen-1.jpg"
          alt="Daily Facts app screenshot"
        >
      </div>

    </section>

    <footer>

      <span>
        © <span id="year"></span> Daily Facts
      </span>

      <span class="links">

        <a
          id="footerRelease"
          href="#"
          target="_blank"
          rel="noopener"
        >
          Release
        </a>

        <span>·</span>

        <a href="mailto:dailyfacts.support@gmail.com">
          Support
        </a>

      </span>

    </footer>

  </main>

  <script>
    /* Current year */
    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* --------------------------------
       Automatic screenshot slideshow
       -------------------------------- */

    const screenshots = [
      "assets/app-screen-1.jpg",
      "assets/app-screen-2.jpg",
      "assets/app-screen-3.jpg",
      "assets/app-screen-4.jpg",
      "assets/app-screen-5.jpg"
    ];

    const screenshotImage =
      document.getElementById("appScreenshot");

    let screenshotIndex = 0;


    /* Preload screenshots for smoother switching */
    screenshots.forEach((src) => {
      const image = new Image();
      image.src = src;
    });


    /* Change screenshot every 3 seconds */
    setInterval(() => {

      screenshotImage.classList.add("changing");

      setTimeout(() => {

        screenshotIndex =
          (screenshotIndex + 1) % screenshots.length;

        screenshotImage.src =
          screenshots[screenshotIndex];

        screenshotImage.classList.remove("changing");

      }, 400);

    }, 3000);


    /* --------------------------------
       Automatic latest GitHub release
       -------------------------------- */

    const apiUrl =
      "https://api.github.com/repos/creativeAnil/daily-facts-content/releases/latest";


    async function loadLatestRelease() {

      const versionElement =
        document.getElementById("version");

      const downloadButton =
        document.getElementById("downloadButton");

      const releaseLink =
        document.getElementById("releaseLink");

      const footerRelease =
        document.getElementById("footerRelease");


      try {

        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });


        if (!response.ok) {
          throw new Error("GitHub release request failed");
        }


        const release =
          await response.json();


        const version =
          release.tag_name ||
          release.name ||
          "Unknown";


        const apk =
          release.assets.find(asset =>
            asset.name
              .toLowerCase()
              .endsWith(".apk")
          );


        versionElement.textContent =
          version;


        releaseLink.href =
          release.html_url;


        footerRelease.href =
          release.html_url;


        if (apk) {

          downloadButton.href =
            apk.browser_download_url;

        } else {

          downloadButton.textContent =
            "APK not available";

          downloadButton.removeAttribute("href");

        }


      } catch (error) {

        console.error(
          "Unable to load latest release:",
          error
        );


        versionElement.textContent =
          "Unavailable";


        downloadButton.textContent =
          "Download unavailable";

        downloadButton.removeAttribute("href");


        const releasesUrl =
          "https://github.com/creativeAnil/daily-facts-content/releases";


        releaseLink.href =
          releasesUrl;

        footerRelease.href =
          releasesUrl;

      }

    }


    loadLatestRelease();

  </script>

</body>
</html>
