<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="Download the Daily Facts Android app."
  >

  <link
    rel="icon"
    href="assets/logo.png"
  >

  <title>Daily Facts</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main class="page">

    <section class="hero">

      <div class="copy">

        <img
          class="logo"
          src="assets/logo.png"
          alt="Daily Facts logo"
        >

        <p class="kicker">ANDROID APP</p>

        <h1>Daily Facts</h1>

        <p class="tagline">
          हर दिन कुछ नया जानें
        </p>

        <p class="description">
          Interesting facts across science, history, nature, technology,
          human body, space and more.
        </p>

        <a
          id="downloadButton"
          class="download"
          href="https://github.com/creativeAnil/daily-facts-content/releases/download/v1.0.9/daily-facts-v1.0.9.apk"
        >
          Download APK
        </a>

      </div>

      <div class="preview">

        <img
          id="appScreenshot"
          src="assets/app-screen-1.jpg"
          alt="Daily Facts app screenshot"
        >

      </div>

    </section>

    <footer>

      <span>
        © <span id="year"></span> Daily Facts
      </span>

      <a
        href="mailto:dailyfacts.support@gmail.com"
      >
        Support
      </a>

    </footer>

  </main>

  <script>

    /* ------------------------------
       Current year
       ------------------------------ */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* ------------------------------
       Screenshot slideshow
       ------------------------------ */

    const screenshots = [
      "assets/app-screen-1.jpg",
      "assets/app-screen-2.jpg",
      "assets/app-screen-3.jpg",
      "assets/app-screen-4.jpg",
      "assets/app-screen-5.jpg"
    ];

    const screenshotImage =
      document.getElementById("appScreenshot");

    let screenshotIndex = 0;


    /* Preload all screenshots */

    screenshots.forEach((src) => {

      const image = new Image();

      image.src = src;

    });


    /* Change screenshot every 3 seconds */

    setInterval(() => {

      screenshotImage.classList.add("changing");

      setTimeout(() => {

        screenshotIndex =
          (screenshotIndex + 1) % screenshots.length;

        screenshotImage.src =
          screenshots[screenshotIndex];

        screenshotImage.classList.remove("changing");

      }, 400);

    }, 3000);


    /* ------------------------------
       Automatically find latest APK
       ------------------------------ */

    const latestReleaseApi =
      "https://api.github.com/repos/creativeAnil/daily-facts-content/releases/latest";

    const downloadButton =
      document.getElementById("downloadButton");


    async function updateDownloadButton() {

      try {

        const response =
          await fetch(latestReleaseApi, {
            headers: {
              "Accept": "application/vnd.github+json"
            }
          });


        if (!response.ok) {
          throw new Error("Unable to load latest release");
        }


        const release =
          await response.json();


        const apk =
          release.assets.find((asset) =>
            asset.name
              .toLowerCase()
              .endsWith(".apk")
          );


        if (apk) {

          downloadButton.href =
            apk.browser_download_url;

        }

      } catch (error) {

        /*
          Keep the current v1.0.9 APK as a fallback.
          If GitHub API is temporarily unavailable,
          the download button will still work.
        */

        console.error(
          "Latest release lookup failed:",
          error
        );

      }

    }


    updateDownloadButton();

  </script>

</body>
</html>
